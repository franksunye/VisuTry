name: Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-and-unit:
    name: Static + Critical Business + Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1
      SKIP_ENV_VALIDATION: 1
      NEXTAUTH_SECRET: ci-only-nextauth-secret
      NEXTAUTH_URL: http://127.0.0.1:3001
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      # Prisma generate loads prisma.config.ts and requires a URL, but the PR
      # gate must stay isolated from production data and external databases.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/visutry_ci
      DATABASE_URL_UNPOOLED: postgresql://ci:ci@localhost:5432/visutry_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript gate
        run: npm run typecheck

      - name: Critical business journey gate
        run: npm run test:critical:ci

      - name: Full unit and regression gate
        run: npm run test:unit:ci

      - name: Playwright suite discovery gate
        run: npm run test:e2e:list

      - name: Production build gate
        run: npm run build:ci
