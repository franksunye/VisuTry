name: Release Public HTML Offload

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Vercel Production deployment ID to independently verify
        required: true
        type: string
      git_sha:
        description: Full SHA of the intended current origin/main release
        required: true
        type: string
      cloudflare_mode:
        description: Cloudflare deployment decision override
        required: true
        default: auto
        type: choice
        options:
          - auto
          - force

permissions:
  contents: read

concurrency:
  group: production-public-html-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_GIT_SHA: ${{ inputs.git_sha }}
      CLOUDFLARE_DEPLOY_MODE: ${{ inputs.cloudflare_mode }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_D1_DEPLOYMENT_READ_TOKEN }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
      VERCEL_PRODUCTION_ALIAS: www.visutry.com
      VERCEL_PRODUCTION_SHA: ${{ inputs.git_sha }}
      VERCEL_PRODUCTION_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
    steps:
      - name: Checkout the requested main SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.git_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Fetch the current main ref
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Verify target SHA is current main
        run: npx tsx scripts/public-html-release.ts --verify-main

      - name: Independently verify Vercel Production
        id: vercel-proof
        run: |
          npx tsx scripts/public-html-release.ts --verify-vercel | tee "$RUNNER_TEMP/vercel-production-proof.jsonl"
          node <<'NODE'
          const fs = require('fs')
          const lines = fs.readFileSync(`${process.env.RUNNER_TEMP}/vercel-production-proof.jsonl`, 'utf8').trim().split('\n')
          const proof = [...lines].reverse().map((line) => {
            try { return JSON.parse(line) } catch { return null }
          }).find((value) => value && value.event === 'public_html_release_vercel_verified')
          if (!proof || typeof proof.vercelOrigin !== 'string' || !proof.vercelOrigin.endsWith('.vercel.app')) {
            throw new Error('Vercel proof did not provide a verified deployment origin')
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `origin_url=${proof.vercelOrigin}\n`)
          NODE

      - name: Generate non-mutating release plan
        run: npx tsx scripts/public-html-release.ts --plan | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Detect Cloudflare deployment requirement
        id: cloudflare-decision
        run: |
          npx tsx scripts/public-html-release.ts --detect-cloudflare-deploy > "$RUNNER_TEMP/public-html-cloudflare-decision.json"
          cat "$RUNNER_TEMP/public-html-cloudflare-decision.json"
          node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/public-html-cloudflare-decision.json","utf8")); console.log(`deploy_required=${d.deployRequired}`); console.log(`matching_files=${d.matchingFiles.join(",")}`)' >> "$GITHUB_OUTPUT"

      - name: Build Cloudflare traffic-layer artifact
        if: steps.cloudflare-decision.outputs.deploy_required == 'true'
        run: npm run ci:cloudflare:build

      - name: Deploy Cloudflare production traffic layer
        if: steps.cloudflare-decision.outputs.deploy_required == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_HTML_WORKER_DEPLOY_TOKEN }}
        run: npm run ci:cloudflare:deploy:production

      - name: Verify Cloudflare production Worker Routes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLIC_HTML_WORKER_DEPLOY_TOKEN }}
        run: npx tsx scripts/public-html-release.ts --verify-routes

      - name: Open exact purge gate after Vercel proof
        run: echo 'PUBLIC_HTML_RELEASE_PURGE_APPROVED=1' >> "$GITHUB_ENV"

      - name: Purge exactly the seven Public HTML URLs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_CACHE_PURGE_TOKEN }}
        run: npx tsx scripts/public-html-release.ts --purge

      - name: Warm and classify Public HTML cache probe
        env:
          # GitHub-hosted Runner traffic is challenged by the zone's Bot Fight
          # Mode. The release probe may classify only a response carrying
          # Cloudflare's cf-mitigated: challenge signal; ordinary HTTP failures
          # remain hard failures. A trusted local/browser probe is authoritative
          # when this non-authoritative Runner probe is challenged.
          PUBLIC_HTML_RELEASE_ALLOW_SECURITY_CHALLENGE: '1'
        run: npx tsx scripts/public-html-release.ts --warm

      - name: Run Producer Smoke against verified Vercel origin
        env:
          SMOKE_BASE_URL: ${{ steps.vercel-proof.outputs.origin_url }}
          SMOKE_TARGET: vercel-origin
          SMOKE_ATTEMPTS: 3
          SMOKE_DELAY_MS: 5000
        run: npm run test:smoke:production

      - name: Publish release result
        if: always()
        run: |
          {
            echo '## Public HTML Release Evidence'
            echo
            echo "- Release SHA: \`$RELEASE_GIT_SHA\`"
            echo "- Vercel deployment ID: \`${{ inputs.deployment_id }}\`"
            echo '- Vercel proof: required before mutation'
            echo "- Cloudflare deploy required: \`${{ steps.cloudflare-decision.outputs.deploy_required }}\`"
            echo "- Cloudflare mode: \`${{ inputs.cloudflare_mode }}\`"
            echo '- Public HTML purge: exact files only, count 7'
            echo '- GitHub warm probe: PASS or SECURITY_CHALLENGE_SKIP only when cf-mitigated: challenge is present'
            echo '- Trusted local Public HTML HIT evidence: required when Runner probe is challenged'
            echo '- Producer smoke: verified Vercel origin only; trusted local/browser probe remains authoritative for www.visutry.com Edge delivery'
          } >> "$GITHUB_STEP_SUMMARY"
