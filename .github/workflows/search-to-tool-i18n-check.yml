name: Search to Tool i18n check

on:
  pull_request:
    branches:
      - feat/search-to-tool-i18n-phase-a-impl-5

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx jest tests/unit/config/search-to-tool-i18n.test.ts tests/unit/config/search-combination-i18n.test.ts --runInBand --testTimeout=30000
