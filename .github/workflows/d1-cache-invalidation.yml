name: Invalidate D1 HTML cache after Vercel production promotion

on:
  repository_dispatch:
    types: [vercel-production-promoted]

permissions:
  contents: read

jobs:
  purge-d1-html:
    # Dispatch fields are only lookup inputs. The job independently verifies
    # the deployment through Vercel API before enabling the purge gate.
    # No push trigger exists.
    if: >-
      github.event.client_payload.target == 'production' &&
      github.event.client_payload.ready_state == 'READY' &&
      github.event.client_payload.ready_substate == 'PROMOTED' &&
      github.event.client_payload.deployment_id != '' &&
      github.event.client_payload.git_sha != ''
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_CACHE_PURGE_TOKEN }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_D1_DEPLOYMENT_READ_TOKEN }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
      VERCEL_PRODUCTION_ALIAS: www.visutry.com
      VERCEL_PRODUCTION_SHA: ${{ github.event.client_payload.git_sha }}
      VERCEL_PRODUCTION_DEPLOYMENT_ID: ${{ github.event.client_payload.deployment_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Independently verify Vercel Production deployment
        run: npm run d1:cache:governance -- --verify-vercel
      - name: Open purge gate after Vercel verification
        run: echo 'D1_CACHE_PURGE_APPROVED=1' >> "$GITHUB_ENV"
      - name: Purge only D1-covered HTML prefixes
        run: npm run d1:cache:governance -- --purge
