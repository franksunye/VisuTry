name: Purge Exact SEO Edge HTML

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Verified Vercel Production deployment ID
        required: true
        type: string
      git_sha:
        description: Full Git SHA for that exact production deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: seo-exact-edge-cache-purge
  cancel-in-progress: false

jobs:
  purge-two-urls:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed main code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies without postinstall scripts
        run: npm ci --ignore-scripts

      - name: Print immutable two-URL plan
        run: npx tsx scripts/seo-edge-cache-release.ts --plan

      - name: Verify READY production deployment and fresh Vercel origin
        env:
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_D1_DEPLOYMENT_READ_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_PRODUCTION_ALIAS: visutry-sunye.vercel.app
          VERCEL_PRODUCTION_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          VERCEL_PRODUCTION_SHA: ${{ inputs.git_sha }}
        run: npx tsx scripts/seo-edge-cache-release.ts --verify

      - name: Open purge gate after independent proof
        run: echo 'SEO_EDGE_PURGE_APPROVED=1' >> "$GITHUB_ENV"

      - name: Purge exactly two affected Cloudflare HTML URLs
        env:
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_D1_DEPLOYMENT_READ_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_PRODUCTION_ALIAS: visutry-sunye.vercel.app
          VERCEL_PRODUCTION_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          VERCEL_PRODUCTION_SHA: ${{ inputs.git_sha }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_CACHE_PURGE_TOKEN }}
        run: npx tsx scripts/seo-edge-cache-release.ts --purge

      - name: Record trusted public URL readback requirement
        if: always()
        run: |
          echo 'Only /ru/style/round-face and /de/style/round-face can be purged by this workflow.' >> "$GITHUB_STEP_SUMMARY"
          echo 'After success, externally verify both bare canonical URLs on www.visutry.com; API acceptance is not evidence of cache propagation or Google indexing.' >> "$GITHUB_STEP_SUMMARY"
